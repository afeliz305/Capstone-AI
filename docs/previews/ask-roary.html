<div id="roary-launcher-preview" aria-label="Capstone chat launcher preview">
  <style>
    #roary-launcher-preview {
      --roary-canvas: light-dark(#f2f4f8, #101824);
      --roary-surface: light-dark(#ffffff, #192638);
      --roary-ink: light-dark(#081e3f, #edf3fc);
      --roary-muted: light-dark(#52647b, #b2c0d3);
      --roary-border: light-dark(#dce3ed, #35455c);
      --roary-navy: light-dark(#081e3f, #081e3f);
      --roary-gold: light-dark(#d1a644, #e0b954);
      --roary-white: light-dark(#ffffff, #ffffff);
      --roary-soft-blue: light-dark(#e6eef7, #223c59);
      --roary-shadow: light-dark(rgba(8,30,63,.16), rgba(0,0,0,.35));
      --roary-size: 180px;
      color: var(--roary-ink);
      font: 14px/1.5 "Mulish", "Segoe UI", Arial, sans-serif;
      width: 100%;
    }
    #roary-launcher-preview * { box-sizing: border-box; }
    #roary-launcher-preview [hidden] { display: none !important; }
    #roary-launcher-preview button,
    #roary-launcher-preview input { font: inherit; }
    #roary-launcher-preview button { cursor: pointer; }
    #roary-launcher-preview .roary-window {
      background: var(--roary-canvas);
      border: 1px solid var(--roary-border);
      border-radius: 16px;
      overflow: hidden;
    }
    #roary-launcher-preview .roary-masthead {
      background: var(--roary-navy);
      color: var(--roary-white);
      border-bottom: 3px solid var(--roary-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px;
    }
    #roary-launcher-preview .roary-brand { font-size: 18px; font-weight: 800; letter-spacing: .08em; }
    #roary-launcher-preview .roary-preview-label { font-size: 12px; color: var(--roary-gold); }
    #roary-launcher-preview .roary-page { padding: 22px; }
    #roary-launcher-preview .roary-eyebrow { color: var(--roary-muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    #roary-launcher-preview .roary-heading { font-size: 24px; line-height: 1.25; font-weight: 800; margin: 8px 0 12px; }
    #roary-launcher-preview .roary-topics { display: flex; flex-wrap: wrap; gap: 8px; }
    #roary-launcher-preview .roary-topic { background: var(--roary-surface); border: 1px solid var(--roary-border); padding: 7px 11px; border-radius: 8px; font-size: 12px; }
    #roary-launcher-preview .roary-dock { display: flex; justify-content: flex-end; align-items: flex-end; padding: 18px 22px 22px; min-height: 250px; }
    #roary-launcher-preview .roary-launcher {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: var(--roary-size);
      max-width: 100%;
      padding: 0;
      border: 2px solid var(--roary-gold);
      border-radius: 18px;
      background: var(--roary-white);
      box-shadow: 0 8px 24px var(--roary-shadow);
      overflow: hidden;
    }
    #roary-launcher-preview .roary-art { display: block; width: 100%; height: auto; padding: 8px; background: var(--roary-white); }
    #roary-launcher-preview .roary-launcher-label { background: var(--roary-navy); color: var(--roary-white); min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 6px; font-weight: 800; }
    #roary-launcher-preview .roary-launcher:hover .roary-launcher-label { color: var(--roary-gold); }
    #roary-launcher-preview .roary-chat { width: 380px; max-width: 100%; background: var(--roary-surface); border: 1px solid var(--roary-border); border-radius: 16px; box-shadow: 0 8px 24px var(--roary-shadow); overflow: hidden; }
    #roary-launcher-preview .roary-chat-header { padding: 14px 16px; border-bottom: 1px solid var(--roary-border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #roary-launcher-preview .roary-chat-title { font-weight: 800; }
    #roary-launcher-preview .roary-chat-status { font-size: 12px; color: var(--roary-muted); }
    #roary-launcher-preview .roary-minimize { background: var(--roary-surface); color: var(--roary-ink); border: 1px solid var(--roary-border); border-radius: 8px; width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 auto; }
    #roary-launcher-preview .roary-messages { padding: 18px; min-height: 180px; }
    #roary-launcher-preview .roary-message { background: var(--roary-soft-blue); border-radius: 4px 12px 12px 12px; padding: 14px; margin-bottom: 14px; }
    #roary-launcher-preview .roary-message p { margin: 0; }
    #roary-launcher-preview .roary-message p + p { margin-top: 8px; }
    #roary-launcher-preview .roary-demo-notice { color: var(--roary-muted); font-size: 12px; }
    #roary-launcher-preview .roary-composer { padding: 14px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--roary-border); }
    #roary-launcher-preview .roary-composer input { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--roary-border); border-radius: 9px; background: var(--roary-canvas); color: var(--roary-ink); font-size: 16px; }
    #roary-launcher-preview .roary-composer button { min-height: 44px; border: 0; border-radius: 9px; padding: 10px 14px; color: var(--roary-white); background: var(--roary-navy); }
    #roary-launcher-preview .roary-composer button:disabled { cursor: default; opacity: .55; }
    @media (max-width: 400px) {
      #roary-launcher-preview .roary-masthead { padding: 14px; }
      #roary-launcher-preview .roary-page { padding: 18px 14px; }
      #roary-launcher-preview .roary-dock { padding: 8px 14px 14px; }
    }
  </style>

  <script>
    (() => {
      const root = document.getElementById('roary-launcher-preview');
      const launcher = root.querySelector('.roary-launcher');
      const panel = root.querySelector('.roary-chat');
      const minimize = root.querySelector('.roary-minimize');
      const label = root.querySelector('.roary-button-text');
      const state = { size: 180, label: "Let's chat" };
      function render() {
        root.style.setProperty('--roary-size', state.size + 'px');
        label.textContent = state.label;
      }
      function setOpen(open) {
        launcher.hidden = open;
        panel.hidden = !open;
        launcher.setAttribute('aria-expanded', String(open));
        (open ? minimize : launcher).focus();
      }
      launcher.addEventListener('click', () => setOpen(true));
      minimize.addEventListener('click', () => setOpen(false));
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !panel.hidden) { event.preventDefault(); setOpen(false); }
      });
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSlider(state, 'size', { label: 'Button width', min: 140, max: 220, step: 10, unit: 'px' });
        tweak.addSelect(state, 'label', { label: 'Button label', options: ["Let's chat", 'Chat with Capstone', 'Ask Roary'] });
      }
    })();
  </script>
